
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eksplore-app
    restart: unless-stopped
    ports:
      - "8002:10000"
    env_file:
      - .env
    environment:
      # Supabase memakai PostgreSQL dan mewajibkan koneksi SSL.
      # Kredensial DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, dan DB_PASSWORD
      # tetap dibaca dari .env melalui env_file di atas.
      DB_CONNECTION: pgsql
      DB_SSLMODE: require
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
