
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eksplore-app
    restart: unless-stopped
    ports:
      - "8002:10000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
